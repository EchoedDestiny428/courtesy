<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courtesy</title>
  <link rel="icon" href="courtesy-black.png">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-white text-black font-sans antialiased select-none overflow-hidden">

  <!-- ================================================================
       1. LOGIN / PORTAL SCREEN (ONLY LOGO & BUTTONS, NO OTHER WORDS)
       ================================================================ -->
  <section id="view-portal" class="min-h-screen flex flex-col items-center justify-center p-6 relative z-10">
    
    <!-- Titlebar Window Controls -->
    <div class="fixed top-0 left-0 right-0 h-10 z-50 titlebar-drag-region flex items-center justify-end px-2">
      <div class="flex items-center gap-0.5 no-drag">
        <button onclick="windowMinimize()" class="p-1.5 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition" title="Minimize">
          <i data-lucide="minus" class="w-3.5 h-3.5"></i>
        </button>
        <button onclick="windowMaximize()" class="p-1.5 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition" title="Maximize">
          <i data-lucide="square" class="w-3 h-3"></i>
        </button>
        <button onclick="windowClose()" class="p-1.5 hover:bg-rose-600 hover:text-white text-neutral-400 rounded transition" title="Close">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- Centered Content: Logo, Buttons, and Animated Server Sequence -->
    <div class="flex flex-col items-center space-y-6">
      
      <!-- Minimal Logo -->
      <div class="cursor-pointer transition hover:opacity-85" onclick="launchIdeSequence()">
        <img id="portal-logo-img" src="courtesy-black.png" alt="Courtesy" class="w-28 h-28 object-contain">
      </div>

      <!-- Minimal Buttons -->
      <div id="portal-actions" class="flex items-center gap-3 transition-opacity duration-200">
        <button id="btn-portal-ide" onclick="launchIdeSequence()"
          class="px-6 py-2.5 rounded-xl bg-black text-white font-medium text-xs shadow-sm hover:bg-neutral-800 transition">
          IDE
        </button>
        <button id="btn-portal-admin" onclick="showView('view-admin')"
          class="px-6 py-2.5 rounded-xl border border-neutral-200 text-neutral-800 hover:border-black hover:text-black font-medium text-xs transition">
          Admin
        </button>
      </div>

      <!-- Dynamic Server Sequence Display (Shown on IDE click) -->
      <div id="portal-server-sequence" class="hidden flex flex-col font-mono text-xs w-[420px] px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-xl space-y-1.5 select-none transition-all duration-200">
      </div>

    </div>

  </section>


  <!-- ================================================================
       2. MINIMALIST IDE SCREEN (FROM SCRATCH CANVAS)
       ================================================================ -->
  <main id="view-standard" class="h-screen flex flex-col overflow-hidden hidden bg-white text-black">

    <!-- Minimal Top Bar -->
    <header class="h-11 px-4 flex items-center justify-between border-b border-neutral-200 bg-white z-30 text-xs titlebar-drag-region select-none">
      
      <!-- Left: Return to Portal & Brand -->
      <div class="flex items-center gap-3 no-drag">
        <button onclick="returnToPortal()" class="p-1 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition" title="Back to Portal">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        </button>
        <div class="flex items-center gap-1.5 cursor-pointer hover:opacity-80 transition" onclick="returnToPortal()">
          <img src="courtesy-black.png" alt="Courtesy" class="w-4 h-4 object-contain">
          <span class="font-semibold text-xs tracking-tight text-black">Courtesy</span>
        </div>
      </div>

      <!-- Center: Connected Server Telemetry Badge -->
      <div class="flex items-center gap-2 no-drag">
        <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-neutral-50 border border-neutral-200 text-[11px] font-mono text-neutral-600">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="ide-connected-node">cst7 (10.11.2.12)</span>
        </div>
      </div>

      <!-- Right: Window Controls -->
      <div class="flex items-center gap-0.5 no-drag">
        <button onclick="windowMinimize()" class="p-1 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition" title="Minimize">
          <i data-lucide="minus" class="w-3.5 h-3.5"></i>
        </button>
        <button onclick="windowMaximize()" class="p-1 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition" title="Maximize">
          <i data-lucide="square" class="w-3 h-3"></i>
        </button>
        <button onclick="windowClose()" class="p-1 hover:bg-rose-600 hover:text-white text-neutral-400 rounded transition" title="Close">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

    </header>

    <!-- Clean Blank IDE Canvas Ready For You To Build From Scratch -->
    <div id="ide-canvas" class="flex-1 flex flex-col bg-white overflow-hidden relative">
      <textarea id="editor-textarea" spellcheck="false"
        placeholder="Start coding here..."
        class="flex-1 w-full h-full p-6 font-mono text-xs leading-6 bg-transparent text-black placeholder-neutral-300 resize-none focus:outline-none border-none select-text whitespace-pre overflow-auto"></textarea>
    </div>

  </main>


  <!-- ================================================================
       3. ADMIN SCREEN (CLEAN BLANK CANVAS)
       ================================================================ -->
  <div id="view-admin" class="h-screen flex flex-col overflow-hidden hidden bg-white text-black">

    <!-- Minimal Top Bar -->
    <header class="h-11 px-4 flex items-center justify-between border-b border-neutral-200 bg-white z-30 text-xs titlebar-drag-region select-none">
      <div class="flex items-center gap-2 no-drag cursor-pointer hover:opacity-75 transition" onclick="returnToPortal()" title="Back">
        <img src="courtesy-black.png" alt="Courtesy" class="w-4 h-4 object-contain">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-neutral-500"></i>
      </div>
      <div class="flex items-center gap-0.5 no-drag">
        <button onclick="windowMinimize()" class="p-1 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition">
          <i data-lucide="minus" class="w-3.5 h-3.5"></i>
        </button>
        <button onclick="windowMaximize()" class="p-1 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition">
          <i data-lucide="square" class="w-3 h-3"></i>
        </button>
        <button onclick="windowClose()" class="p-1 hover:bg-rose-600 hover:text-white text-neutral-400 rounded transition">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </header>

    <div class="flex-1 flex items-center justify-center bg-white text-neutral-400 font-mono text-xs">
      Admin screen ready from scratch
    </div>

  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none"></div>

  <script src="app.js"></script>
</body>

</html>
