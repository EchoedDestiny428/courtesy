<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courtesy</title>
  <link rel="icon" href="courtesy-black.png">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Markdown & Code Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>

<body class="bg-white text-black font-sans antialiased select-none overflow-hidden">

  <!-- ================================================================
       1. LOGIN / PORTAL SCREEN (ONLY LOGO & BUTTONS, NO OTHER WORDS)
       ================================================================ -->
  <section id="view-portal" class="min-h-screen flex flex-col items-center justify-center p-6 relative z-10">
    
    <!-- Titlebar Window Controls -->
    <div class="fixed top-0 left-0 right-0 h-10 z-50 titlebar-drag-region flex items-center justify-end px-2">
      <div class="flex items-center gap-0.5 no-drag">
        <button onclick="windowMinimize()" class="p-1.5 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition" title="Minimize">
          <i data-lucide="minus" class="w-3.5 h-3.5"></i>
        </button>
        <button onclick="windowMaximize()" class="p-1.5 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition" title="Maximize">
          <i data-lucide="square" class="w-3 h-3"></i>
        </button>
        <button onclick="windowClose()" class="p-1.5 hover:bg-rose-600 hover:text-white text-neutral-400 rounded transition" title="Close">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- Centered Content: Logo, Buttons, and Animated Server Sequence -->
    <div class="flex flex-col items-center space-y-6">
      
      <!-- Minimal Logo -->
      <div class="cursor-pointer transition hover:opacity-85" onclick="launchIdeSequence()">
        <img id="portal-logo-img" src="courtesy-black.png" alt="Courtesy" class="w-28 h-28 object-contain">
      </div>

      <!-- Minimal Buttons -->
      <div id="portal-actions" class="flex items-center gap-3 transition-opacity duration-200">
        <button id="btn-portal-ide" onclick="launchIdeSequence()"
          class="px-6 py-2.5 rounded-xl bg-black text-white font-medium text-xs shadow-sm hover:bg-neutral-800 transition">
          IDE
        </button>
        <button id="btn-portal-admin" onclick="showView('view-admin')"
          class="px-6 py-2.5 rounded-xl border border-neutral-200 text-neutral-800 hover:border-black hover:text-black font-medium text-xs transition">
          Admin
        </button>
      </div>

      <!-- Dynamic Server Sequence Display (Shown on IDE click) -->
      <div id="portal-server-sequence" class="hidden flex flex-col font-mono text-xs w-[420px] px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-xl space-y-1.5 select-none transition-all duration-200">
      </div>

    </div>

  </section>


  <!-- ================================================================
       2. MINIMALIST IDE SCREEN (FROM SCRATCH CANVAS)
       ================================================================ -->
  <main id="view-standard" class="h-screen flex flex-col overflow-hidden hidden bg-white text-black">

    <!-- Minimal Top Bar -->
    <header class="h-11 px-4 flex items-center justify-between border-b border-neutral-200 bg-white z-30 text-xs titlebar-drag-region select-none">
      
      <!-- Left: Return to Portal, Brand, and Workspace Folder Button -->
      <div class="flex items-center gap-3 no-drag">
        <button onclick="returnToPortal()" class="p-1 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition" title="Back to Portal">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        </button>
        <div class="flex items-center gap-1.5 cursor-pointer hover:opacity-80 transition mr-1" onclick="returnToPortal()">
          <img src="courtesy-black.png" alt="Courtesy" class="w-4 h-4 object-contain">
          <span class="font-semibold text-xs tracking-tight text-black">Courtesy</span>
        </div>
        
        <!-- Folder Chooser Button -->
        <div class="flex items-center gap-1">
          <button id="btn-topbar-folder" onclick="pickWorkspaceFolder()"
            class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg border border-neutral-200 hover:border-black text-neutral-600 hover:text-black transition text-xs font-mono"
            title="Open or Switch Folder (Ctrl+O)">
            <i data-lucide="folder" class="w-3.5 h-3.5"></i>
            <span id="topbar-folder-name">Open Folder</span>
          </button>
          <button id="btn-topbar-close-folder" onclick="closeWorkspaceFolder()"
            class="hidden p-1 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition"
            title="Close workspace folder">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- Center: Connected Server Telemetry Badge -->
      <div class="flex items-center gap-2 no-drag">
        <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-neutral-50 border border-neutral-200 text-[11px] font-mono text-neutral-600">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="ide-connected-node">cst7 (10.11.2.12)</span>
        </div>
      </div>

      <!-- Right: Window Controls -->
      <div class="flex items-center gap-0.5 no-drag">
        <button onclick="windowMinimize()" class="p-1 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition" title="Minimize">
          <i data-lucide="minus" class="w-3.5 h-3.5"></i>
        </button>
        <button onclick="windowMaximize()" class="p-1 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition" title="Maximize">
          <i data-lucide="square" class="w-3 h-3"></i>
        </button>
        <button onclick="windowClose()" class="p-1 hover:bg-rose-600 hover:text-white text-neutral-400 rounded transition" title="Close">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

    </header>

    <!-- IDE Canvas (Empty State or Antigravity Conversation Workspace) -->
    <div id="ide-canvas" class="flex-1 flex flex-col bg-white overflow-hidden relative">
      
      <!-- 1. Default Screen: No Folder Chosen -->
      <div id="ide-empty-state" class="flex-1 flex flex-col items-center justify-center relative select-none bg-white p-6">
        <div class="relative flex flex-col items-center text-center max-w-sm w-full">
          <img src="courtesy-black.png" alt="Courtesy" class="w-20 h-20 object-contain opacity-20 mb-6 select-none pointer-events-none transition duration-500">
          <h1 class="text-base font-semibold tracking-tight text-black mb-1.5">Open a folder to start</h1>
          <p class="text-xs text-neutral-400 font-mono mb-6">Select a project directory to explore code and converse with Courtesy</p>
          <button onclick="pickWorkspaceFolder()"
            class="px-5 py-2.5 rounded-xl bg-black hover:bg-neutral-800 text-white font-medium text-xs shadow-sm flex items-center gap-2 transition hover:scale-[1.02] active:scale-[0.98]">
            <i data-lucide="folder-open" class="w-4 h-4"></i>
            <span>Open Folder</span>
            <span class="ml-1 text-[10px] text-neutral-400 font-mono bg-neutral-800 px-1.5 py-0.5 rounded">Ctrl+O</span>
          </button>
        </div>
      </div>

      <!-- 2. Active Workspace State (Conversation Above, Antigravity Input Bar Below) -->
      <div id="ide-workspace-view" class="flex-1 flex flex-col overflow-hidden relative bg-white hidden">
        
        <!-- Conversation Area Above Input -->
        <div id="ide-conversation-container" class="flex-1 overflow-y-auto px-6 py-6 space-y-4">
          
          <!-- Welcome banner before messages -->
          <div id="ide-conversation-welcome" class="max-w-2xl mx-auto flex flex-col items-center text-center py-6 select-none">
            <img src="courtesy-black.png" alt="Courtesy" class="w-10 h-10 object-contain mb-3 opacity-80">
            <div class="text-sm font-semibold text-black mb-1" id="ide-welcome-folder-title">Workspace: <span class="font-mono">folder</span></div>
            <div class="text-xs text-neutral-400 font-mono mb-6" id="ide-welcome-file-count">Scanning files...</div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full text-left">
              <button onclick="sendQuickPrompt('Explain the project structure and architecture')"
                class="p-3 rounded-xl border border-neutral-200 hover:border-black text-neutral-700 hover:text-black transition text-xs flex flex-col gap-0.5 group">
                <span class="font-medium group-hover:text-black">Architecture Overview</span>
                <span class="text-[11px] text-neutral-400">Explain the directory structure and core modules</span>
              </button>
              <button onclick="sendQuickPrompt('Analyze this repository for potential bugs and edge cases')"
                class="p-3 rounded-xl border border-neutral-200 hover:border-black text-neutral-700 hover:text-black transition text-xs flex flex-col gap-0.5 group">
                <span class="font-medium group-hover:text-black">Code Audit</span>
                <span class="text-[11px] text-neutral-400">Identify bugs, race conditions, and bottlenecks</span>
              </button>
              <button onclick="sendQuickPrompt('/plan ')"
                class="p-3 rounded-xl border border-neutral-200 hover:border-black text-neutral-700 hover:text-black transition text-xs flex flex-col gap-0.5 group">
                <span class="font-medium group-hover:text-black">Implementation Plan</span>
                <span class="text-[11px] text-neutral-400">Generate a step-by-step implementation blueprint</span>
              </button>
              <button onclick="sendQuickPrompt('List the main functions and dependencies')"
                class="p-3 rounded-xl border border-neutral-200 hover:border-black text-neutral-700 hover:text-black transition text-xs flex flex-col gap-0.5 group">
                <span class="font-medium group-hover:text-black">Functions & Imports</span>
                <span class="text-[11px] text-neutral-400">Summarize APIs and external imports</span>
              </button>
            </div>
          </div>

          <!-- Messages List -->
          <div id="ide-messages-list" class="space-y-4 max-w-2xl mx-auto w-full"></div>

        </div>

        <!-- Antigravity Input Bar at Bottom -->
        <div id="ide-input-bar-wrapper" class="p-4 w-full max-w-2xl mx-auto select-none">
          <div class="rounded-2xl border border-neutral-200 focus-within:border-neutral-900 focus-within:shadow-md transition-all duration-200 bg-white p-3 flex flex-col gap-2">
            
            <!-- Textarea Input -->
            <textarea id="ide-chat-input" rows="1"
              placeholder="Ask Courtesy anything, explore code, or plan changes..."
              class="w-full bg-transparent text-xs text-black placeholder-neutral-400 resize-none focus:outline-none leading-relaxed max-h-40 overflow-y-auto font-sans select-text"></textarea>

            <!-- Bottom Toolbar Inside Card -->
            <div class="flex items-center justify-between pt-1.5 border-t border-neutral-100 text-xs">
              
              <!-- Left Badges -->
              <div class="flex items-center gap-1.5 text-[11px] font-mono text-neutral-500">
                <span id="ide-active-folder-badge" class="flex items-center gap-1 px-2 py-0.5 rounded-md bg-neutral-100 text-neutral-700">
                  <i data-lucide="folder" class="w-3 h-3"></i>
                  <span id="ide-active-folder-name">folder</span>
                </span>
                <span class="flex items-center gap-1 px-2 py-0.5 rounded-md bg-neutral-100 text-neutral-700">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span id="ide-input-model-badge">cst7 • 14B</span>
                </span>
              </div>

              <!-- Right Send/Stop Action -->
              <div class="flex items-center gap-1.5">
                <button id="ide-send-btn" onclick="sendIdeChat()"
                  class="w-7 h-7 rounded-full bg-black text-white hover:bg-neutral-800 disabled:opacity-30 disabled:hover:bg-black flex items-center justify-center transition shadow-sm"
                  title="Send prompt (Enter)">
                  <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
                </button>
                <button id="ide-stop-btn" onclick="stopIdeChat()"
                  class="w-7 h-7 rounded-full bg-rose-600 text-white hover:bg-rose-700 hidden flex items-center justify-center transition shadow-sm"
                  title="Stop generating (Esc)">
                  <i data-lucide="square" class="w-3 h-3 fill-current"></i>
                </button>
              </div>

            </div>

          </div>
          <div class="text-center mt-2 text-[10px] font-mono text-neutral-400">
            Press <kbd class="px-1 py-0.5 rounded bg-neutral-100 border border-neutral-200 text-neutral-600">Enter</kbd> to send, <kbd class="px-1 py-0.5 rounded bg-neutral-100 border border-neutral-200 text-neutral-600">Shift+Enter</kbd> for newline
          </div>
        </div>

      </div>

    </div>

  </main>


  <!-- ================================================================
       3. ADMIN SCREEN (CLEAN BLANK CANVAS)
       ================================================================ -->
  <div id="view-admin" class="h-screen flex flex-col overflow-hidden hidden bg-white text-black">

    <!-- Minimal Top Bar -->
    <header class="h-11 px-4 flex items-center justify-between border-b border-neutral-200 bg-white z-30 text-xs titlebar-drag-region select-none">
      <div class="flex items-center gap-2 no-drag cursor-pointer hover:opacity-75 transition" onclick="returnToPortal()" title="Back">
        <img src="courtesy-black.png" alt="Courtesy" class="w-4 h-4 object-contain">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-neutral-500"></i>
      </div>
      <div class="flex items-center gap-0.5 no-drag">
        <button onclick="windowMinimize()" class="p-1 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition">
          <i data-lucide="minus" class="w-3.5 h-3.5"></i>
        </button>
        <button onclick="windowMaximize()" class="p-1 hover:bg-neutral-100 text-neutral-400 hover:text-black rounded transition">
          <i data-lucide="square" class="w-3 h-3"></i>
        </button>
        <button onclick="windowClose()" class="p-1 hover:bg-rose-600 hover:text-white text-neutral-400 rounded transition">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </header>

    <div class="flex-1 flex items-center justify-center bg-white text-neutral-400 font-mono text-xs">
      Admin screen ready from scratch
    </div>

  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none"></div>

  <script src="app.js"></script>
</body>

</html>
