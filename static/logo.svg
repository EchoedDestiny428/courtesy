<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#947216" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Chevron Peak -->
  <polyline points="421,1224 814,582 1188,1224" fill="none" stroke="url(#goldGrad)" stroke-width="56" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="4" />

  <!-- Right Closed Triangle -->
  <polygon points="781,1224 1180,582 1579,1224" fill="none" stroke="url(#goldGrad)" stroke-width="56" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="4" />
</svg>
